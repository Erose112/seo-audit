<html lang="en">
<head>

  <meta name="description" content="This page declares two top-level headings instead of one.">
  <link rel="canonical" href="https://example.com/multiple-h1">
  <title>Example Title</title>
</head>
<body>
  <h1>First Heading</h1>
  <p>Some introductory copy under the first heading.</p>
  <h1>Second Heading</h1>
  <p>More copy under the second heading.</p>
  <img src="/img/one.png" alt="First image">
  <a href="/about">About</a>
</body>
</html>
